[package]
name = "ftdata-paid-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API for ftdata-paid: /v1/quote, /v1/download with x402 payment middleware, /v1/jobs/{id}, /v1/info."

[lib]
path = "src/lib.rs"

[dependencies]
ftdata-paid-pricing = { path = "../ftdata-paid-pricing" }
ftdata-paid-facilitator = { path = "../ftdata-paid-facilitator" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[[bin]]
name = "ftdata-paid-server"
path = "src/bin/server.rs"

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
tower = { workspace = true, features = ["util"] }
