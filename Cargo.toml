[workspace]
resolver = "2"
members = [
    "ftdata-cli",
    "ftdata-core",
    "ftdata-http",
    "ftdata-sources",
    "ftdata-storage",
    "ftdata-analysis",
    "ftdata-paid-pricing",
    "ftdata-paid-facilitator",
    "ftdata-paid-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ftdata contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gyc567/ftdata"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
polars = { version = "0.55", features = ["parquet", "ipc"] }
apache-arrow = { version = "17", features = ["parquet", "ipc"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
url = "2.5"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
directories = "5.0"
once_cell = "1.19"
parking_lot = "0.12"
zip = "2.2"
flate2 = "1.0"

# x402 paid layer
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
dashmap = "6"
uuid = { version = "1.10", features = ["v4"] }
